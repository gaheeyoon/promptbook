name: Keep Supabase Active

on:
  schedule:
    - cron: '0 0 */3 * *'  # 3일마다 자정(UTC) 실행
  workflow_dispatch:         # 수동 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ovhgljplbsjaxzhgopgm.supabase.co/rest/v1/sessions?limit=1" \
            -H "apikey: sb_publishable_2xJjgkNh6LUPJ4nMoDtQeA_BGsBBiiZ" \
            -H "Authorization: Bearer sb_publishable_2xJjgkNh6LUPJ4nMoDtQeA_BGsBBiiZ")
          echo "Supabase response status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: Unexpected status $STATUS"
            exit 1
          fi
